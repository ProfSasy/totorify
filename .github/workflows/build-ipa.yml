name: Build Totorify iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      # Fails the build on analyzer errors only; infos and warnings pass.
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign -v || true

      - name: Package into IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../../Totorify-iOS.ipa Payload
          cd ../..
          ls -lh Totorify-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Totorify-iOS-ipa
          path: Totorify-iOS.ipa
          retention-days: 30
